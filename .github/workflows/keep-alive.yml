name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render free tier spin-down (15 min inactivity threshold)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Backend Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging https://armserve.onrender.com/health..."
          curl -s -f -m 30 "https://armserve.onrender.com/health" || echo "Warning: Keep-alive ping failed or timed out"
