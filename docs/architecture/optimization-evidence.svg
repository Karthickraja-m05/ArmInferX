<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0b0f19;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <text x="500" y="45" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle">ArmServe Optimization Evidence Pipeline</text>
  <text x="500" y="70" font-family="Inter, Roboto, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Empirical Progression from Unoptimized Baseline to Certified Production Release</text>

  <!-- Step 1: Baseline -->
  <g filter="url(#shadow)">
    <rect x="100" y="110" width="800" height="65" rx="10" fill="url(#boxGrad)" stroke="#ef4444" stroke-width="2"/>
    <text x="500" y="138" font-family="Inter, Roboto, sans-serif" font-size="16" font-weight="bold" fill="#fca5a5" text-anchor="middle">1. Baseline Configuration (FP16, 1 Thread, Batch Size 32)</text>
    <text x="500" y="160" font-family="Inter, Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">TTFT: 0.25ms | P50: 14.20ms | Throughput: 131.3 tps | Cost: $0.182 / M Tokens</text>
  </g>

  <path d="M 500 175 L 500 200" stroke="#38bdf8" stroke-width="2" />

  <!-- Step 2: Experiments -->
  <g filter="url(#shadow)">
    <rect x="100" y="200" width="800" height="65" rx="10" fill="url(#boxGrad)" stroke="#a855f7" stroke-width="2"/>
    <text x="500" y="228" font-family="Inter, Roboto, sans-serif" font-size="16" font-weight="bold" fill="#c084fc" text-anchor="middle">2. Optuna TPE Experiments (12-Trial Hyperparameter Grid)</text>
    <text x="500" y="250" font-family="Inter, Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Automated thread scaling (1..8), batch sizing (32..128), and GGUF quantization precision</text>
  </g>

  <path d="M 500 265 L 500 290" stroke="#38bdf8" stroke-width="2" />

  <!-- Step 3: Optimized Configuration -->
  <g filter="url(#shadow)">
    <rect x="100" y="290" width="800" height="65" rx="10" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="500" y="318" font-family="Inter, Roboto, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">3. Optimized Winner (GGUF Q4_K_M, 8 Threads, Batch Size 128)</text>
    <text x="500" y="340" font-family="Inter, Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">TTFT: 0.09ms (64.0% reduction) | P50: 4.85ms (65.8% reduction) | Throughput: 384.2 tps (+192.5%)</text>
  </g>

  <path d="M 500 355 L 500 380" stroke="#38bdf8" stroke-width="2" />

  <!-- Step 4: Quality Validation -->
  <g filter="url(#shadow)">
    <rect x="100" y="380" width="800" height="65" rx="10" fill="url(#boxGrad)" stroke="#22c55e" stroke-width="2"/>
    <text x="500" y="408" font-family="Inter, Roboto, sans-serif" font-size="16" font-weight="bold" fill="#4ade80" text-anchor="middle">4. Quality Validation (98.5% Composite Fidelity)</text>
    <text x="500" y="430" font-family="Inter, Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Cosine Vector Similarity (98.7%) &amp; ROUGE-L Overlap (98.3%) satisfy &gt;95.0% SLA guardrail</text>
  </g>

  <path d="M 500 445 L 500 470" stroke="#38bdf8" stroke-width="2" />

  <!-- Step 5: Cost Validation -->
  <g filter="url(#shadow)">
    <rect x="100" y="470" width="800" height="65" rx="10" fill="url(#boxGrad)" stroke="#eab308" stroke-width="2"/>
    <text x="500" y="498" font-family="Inter, Roboto, sans-serif" font-size="16" font-weight="bold" fill="#fde047" text-anchor="middle">5. Graviton Cost Validation ($0.062 / M Tokens)</text>
    <text x="500" y="520" font-family="Inter, Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Achieves 65.8% inference cost reduction ($0.120 savings per million tokens served)</text>
  </g>

  <path d="M 500 535 L 500 560" stroke="#38bdf8" stroke-width="2" />

  <!-- Step 6: Deployment -->
  <g filter="url(#shadow)">
    <rect x="100" y="560" width="800" height="65" rx="10" fill="url(#boxGrad)" stroke="#10b981" stroke-width="2"/>
    <text x="500" y="588" font-family="Inter, Roboto, sans-serif" font-size="16" font-weight="bold" fill="#34d399" text-anchor="middle">6. Certified Production Deployment (Atomic Rollback Verified: 120.4ms)</text>
    <text x="500" y="610" font-family="Inter, Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Zero-downtime pointer update with complete Arm Performix telemetry correlation</text>
  </g>
</svg>
