version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: armserve-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ARMSERVE_APP__ENV=production
      - ARMSERVE_APP__DEBUG=false
      - ARMSERVE_DATABASE__HOST=postgres
      - ARMSERVE_DATABASE__PORT=5432
      - ARMSERVE_DATABASE__USER=armserve
      - ARMSERVE_DATABASE__PASSWORD=armserve_dev_pass
      - ARMSERVE_DATABASE__NAME=armserve_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: armserve-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: armserve-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: armserve
      POSTGRES_PASSWORD: armserve_dev_pass
      POSTGRES_DB: armserve_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armserve -d armserve_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: armserve-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: armserve-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:10.3.1
    container_name: armserve-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
