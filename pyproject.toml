[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armserve"
version = "0.1.0"
description = "Autonomous AI Inference Optimization Platform for Arm64 Infrastructure"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ArmServe Team", email = "dev@armserve.io" }
]
dependencies = [
    "fastapi>=0.110.0,<0.111.0",
    "uvicorn[standard]>=0.28.0,<0.29.0",
    "pydantic>=2.6.0,<2.7.0",
    "pydantic-settings>=2.2.0,<2.3.0",
    "sqlalchemy[asyncio]>=2.0.28,<2.1.0",
    "asyncpg>=0.29.0,<0.30.0",
    "aiosqlite>=0.20.0,<0.21.0",
    "celery>=5.3.6,<5.4.0",
    "redis>=5.0.2,<5.1.0",
    "optuna>=3.6.0,<3.7.0",
    "onnxruntime>=1.17.1,<1.18.0",
    "numpy>=1.26.4,<2.0.0",
    "httpx>=0.27.0,<0.28.0",
    "structlog>=24.1.0,<24.2.0",
    "typer>=0.9.0,<0.10.0",
    "rich>=13.7.1,<13.8.0",
    "python-dotenv>=1.0.1,<1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0,<8.2.0",
    "pytest-asyncio>=0.23.5,<0.24.0",
    "pytest-cov>=4.1.0,<4.2.0",
    "ruff>=0.3.2,<0.4.0",
    "mypy>=1.9.0,<1.10.0",
    "black>=24.2.0,<24.3.0",
    "isort>=5.13.2,<5.14.0",
]

[project.scripts]
armserve = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "cli*"]

# --- Ruff Formatting & Linting ---
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by black/ruff formatter
    "B008", # FastAPI Depends in function argument defaults
]

[tool.ruff.lint.per-file-ignores]
# Typer 0.9 requires Optional[T] syntax; T | None causes RuntimeError at param reflection
"cli/**" = ["UP007"]


# --- Mypy Type Checking ---
[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
]

[[tool.mypy.overrides]]
module = ["tests.*", "backend.tests.*"]
disallow_untyped_defs = false


# --- Pytest Configuration ---
[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
addopts = "-ra -q --cov=backend/app --cov-report=term-missing"
testpaths = [
    "backend/tests",
]
asyncio_mode = "auto"
python_files = ["test_*.py"]

